name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Required for the deploy-pages action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy runs at a time; skip queued runs but don't cancel in-progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        # Outputs to storybook/ at repo root — picked up by the Pages artifact below.
        run: npm run build-storybook -- --output-dir storybook

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload the whole repo root. The relative path ../src/styles/generated/
      # from button-component/button.html is preserved because both directories
      # sit at the artifact root, so the published URL structure matches the
      # local file layout exactly.
      # Storybook is at /storybook on the same Pages site.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
