<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 900px;
    background: #0D0D0D;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px;
    gap: 64px;
  }

  /* ── Pipeline ── */
  .pipeline {
    display: flex;
    align-items: center;
    width: 100%;
    gap: 0;
  }

  .node {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    flex-shrink: 0;
  }

  .node__logo {
    width: 96px; height: 96px;
    border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
  }

  .node__name {
    font-size: 13px; font-weight: 500;
    color: #3A3A3A; letter-spacing: 0.02em;
    text-align: center;
  }

  /* connector */
  .line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, #1E1E1E, #2A2A2A, #1E1E1E);
    margin-bottom: 36px;
    position: relative;
  }
  .line::after {
    content: '';
    position: absolute;
    right: -1px; top: -4px;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    border-left: 6px solid #2A2A2A;
  }

  /* ── Stats ── */
  .stats {
    display: flex;
    width: 100%;
    gap: 0;
    border-top: 1px solid #161616;
    padding-top: 48px;
  }

  .stat { flex: 1; }
  .stat + .stat { border-left: 1px solid #161616; padding-left: 48px; }

  .stat__n {
    font-size: 64px; font-weight: 700;
    letter-spacing: -0.05em; line-height: 1;
    color: #FFF;
  }
  .stat__n sup { font-size: 32px; vertical-align: super; }

  .stat__label {
    font-size: 13px; color: #2E2E2E;
    margin-top: 8px; letter-spacing: 0.01em;
  }
</style>
</head>
<body>

  <div class="pipeline">

    <!-- Figma -->
    <div class="node">
      <div class="node__logo" style="background:#1C1C1C; border:1px solid #2A2A2A;">
        <svg width="42" height="60" viewBox="0 0 42 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="19" height="28" rx="9.5" fill="#F24E1E"/>
          <rect x="23" y="0" width="19" height="28" rx="9.5" fill="#FF7262"/>
          <rect x="0" y="32" width="19" height="28" rx="9.5" fill="#A259FF"/>
          <circle cx="32" cy="46" r="9.5" fill="#1ABCFE"/>
          <circle cx="9.5" cy="50.5" r="9.5" fill="#0ACF83"/>
        </svg>
      </div>
      <span class="node__name">Figma</span>
    </div>

    <div class="line"></div>

    <!-- Claude -->
    <div class="node">
      <div class="node__logo" style="background:#18120A; border:1px solid #2D200E;">
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M26 6L40 46H33L30 37H22L19 46H12L26 6Z" fill="#C96A10"/>
          <path d="M23.5 33L26 22.5L28.5 33H23.5Z" fill="#18120A"/>
        </svg>
      </div>
      <span class="node__name">Claude</span>
    </div>

    <div class="line"></div>

    <!-- CSS / Tokens -->
    <div class="node">
      <div class="node__logo" style="background:#0A1220; border:1px solid #152240;">
        <svg width="44" height="52" viewBox="0 0 44 52" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 0L4 52L22 52L40 52L44 0H0Z" fill="#264DE4"/>
          <path d="M22 48V6L38 6L34 44L22 48Z" fill="#2965F1"/>
          <text x="22" y="32" font-family="-apple-system,sans-serif" font-size="15" font-weight="800" fill="white" text-anchor="middle">CSS</text>
          <rect x="7" y="14" width="30" height="4" rx="2" fill="white" opacity="0.5"/>
          <rect x="9" y="22" width="20" height="4" rx="2" fill="white" opacity="0.5"/>
        </svg>
      </div>
      <span class="node__name">CSS tokens</span>
    </div>

    <div class="line"></div>

    <!-- Storybook -->
    <div class="node">
      <div class="node__logo" style="background:#160A10; border:1px solid #2E1020;">
        <svg width="42" height="54" viewBox="0 0 42 54" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="38" height="50" rx="5" fill="#FF4785"/>
          <rect x="8" y="10" width="18" height="3" rx="1.5" fill="white" opacity="0.4"/>
          <rect x="8" y="17" width="12" height="3" rx="1.5" fill="white" opacity="0.4"/>
          <path d="M26 8L14 32H22L18 46L34 20H26L29 8Z" fill="white"/>
        </svg>
      </div>
      <span class="node__name">Storybook</span>
    </div>

    <div class="line"></div>

    <!-- HTML -->
    <div class="node">
      <div class="node__logo" style="background:#140C06; border:1px solid #2A1808;">
        <svg width="40" height="48" viewBox="0 0 40 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 0L3.6 44L20 48L36.4 44L40 0H0Z" fill="#E44D26"/>
          <path d="M20 44.4V5H33L29.8 40.4L20 44.4Z" fill="#F16529"/>
          <rect x="7" y="12" width="26" height="4" rx="2" fill="white" opacity="0.7"/>
          <rect x="8" y="21" width="17" height="4" rx="2" fill="white" opacity="0.7"/>
          <text x="20" y="38" font-family="-apple-system,sans-serif" font-size="7" font-weight="700" fill="white" text-anchor="middle" opacity="0.5">HTML · CSS · JS</text>
        </svg>
      </div>
      <span class="node__name">Portfolio</span>
    </div>

  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat__n">419</div>
      <div class="stat__label">Design tokens</div>
    </div>
    <div class="stat">
      <div class="stat__n">25</div>
      <div class="stat__label">Components</div>
    </div>
    <div class="stat">
      <div class="stat__n">6</div>
      <div class="stat__label">Claude skills</div>
    </div>
    <div class="stat">
      <div class="stat__n">1</div>
      <div class="stat__label">Person</div>
    </div>
  </div>

</body>
</html>
